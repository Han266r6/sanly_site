<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanly Aýdym — Türkmen Aýdym Portaly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; padding-bottom: 120px; }
    
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #111827; border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 800; color: #10b981; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .btn-admin { background: #1f2937; color: #9ca3af; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid #374151; }
    .btn-admin:hover { color: #fff; border-color: #10b981; }

    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
    .hero { background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%); border-radius: 16px; padding: 24px; margin-bottom: 24px; border: 1px solid #04785744; }
    .hero h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    .hero p { color: #a7f3d0; font-size: 14px; line-height: 1.4; }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .status-badge { font-size: 12px; background: #10b98122; color: #34d399; padding: 4px 10px; border-radius: 20px; border: 1px solid #10b98144; }

    .songs-table { display: flex; flex-direction: column; gap: 8px; }
    .song-row { display: flex; align-items: center; justify-content: space-between; background: #111827; padding: 12px 14px; border-radius: 10px; border: 1px solid #1f2937; transition: 0.2s; cursor: pointer; }
    .song-row:hover { background: #1f2937; border-color: #374151; }
    .song-row.playing { border-color: #10b981; background: #064e3b22; }
    
    .song-left { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
    .play-icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #10b981; color: #000; border: none; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; flex-shrink: 0; }
    .song-meta { overflow: hidden; }
    .song-meta h4 { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-meta span { font-size: 12px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    .song-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .btn-download { background: #1f2937; color: #38bdf8; border: 1px solid #38bdf844; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-download:hover { background: #38bdf8; color: #000; }

    /* PLEÝER */
    .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111827f2; backdrop-filter: blur(12px); border-top: 1px solid #1f2937; padding: 12px 16px; z-index: 200; }
    .player-inner { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .player-controls { display: flex; align-items: center; justify-content: space-between; }
    .np-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
    .np-artist { font-size: 11px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }

    .center-buttons { display: flex; align-items: center; gap: 14px; }
    .btn-ctrl { background: transparent; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; }
    .btn-ctrl:hover { color: #fff; }
    .btn-play-main { width: 42px; height: 42px; border-radius: 50%; background: #10b981; color: #000; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .progress-wrap { display: flex; align-items: center; gap: 10px; width: 100%; }
    .time-text { font-size: 11px; color: #6b7280; font-family: monospace; min-width: 32px; }
    .progress-bar-bg { flex: 1; height: 6px; background: #374151; border-radius: 3px; position: relative; cursor: pointer; }
    .progress-bar-fill { height: 100%; background: #10b981; border-radius: 3px; width: 0%; pointer-events: none; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🎵 Sanly Aýdym</a>
    <div class="nav-actions">
      <a href="admin.html" class="btn-admin">⚙️ Admin Paneli</a>
    </div>
  </nav>

  <div class="container">
    <div class="hero">
      <h1>Türkmenistan Aýdym Portaly</h1>
      <p>Aýdymlary dünýäniň ähli ýerinden ýokary tizlikde diňläň we göni telefonyňyza ýükläp alyň.</p>
    </div>

    <div class="section-title">
      <span>🔥 Aýdymlar Sanawy</span>
      <span id="statusBadge" class="status-badge">GitHub-dan aýdymlar barlanýar...</span>
    </div>

    <div id="songsList" class="songs-table">
      <div style="text-align: center; color: #9ca3af; padding: 30px;">Aýdymlar ýüklenýär, garaşyň...</div>
    </div>
  </div>

  <!-- AŞAKDYKY PLEÝER -->
  <div class="player-bar">
    <div class="player-inner">
      <div class="player-controls">
        <div>
          <div class="np-title" id="npTitle">Aýdym saýlaň</div>
          <div class="np-artist" id="npArtist">—</div>
        </div>

        <div class="center-buttons">
          <button class="btn-ctrl" onclick="playPrev()">⏮</button>
          <button class="btn-play-main" id="mainPlayBtn" onclick="togglePlayPause()">▶</button>
          <button class="btn-ctrl" onclick="playNext()">⏭</button>
        </div>

        <div>
          <button class="btn-download" onclick="downloadCurrentSong()">📥 Ýükläp al</button>
        </div>
      </div>

      <div class="progress-wrap">
        <span class="time-text" id="currentTime">00:00</span>
        <div class="progress-bar-bg" id="progressBarBg" onclick="seekAudio(event)">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <span class="time-text" id="totalDuration">00:00</span>
      </div>
    </div>
  </div>

  <audio id="globalAudio"></audio>

  <script>
    const GITHUB_REPO = "Han266r6/sanly_site";
    let songs = [];
    let currentIndex = -1;
    const audio = document.getElementById('globalAudio');

    // GITHUB-DAN AÝDYMLARY AWTOMATIKI TAPÝAN FUNKSIÝA
    async function fetchGitHubSongs() {
      const statusBadge = document.getElementById('statusBadge');
      const loadedSongs = [];

      try {
        // 1. GitHub-yň 'music' papkasyny barlaýarys
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/music?t=` + Date.now());
        if (res.ok) {
          const files = await res.json();
          files.forEach((file, index) => {
            if (file.name.toLowerCase().endsWith('.mp3') || file.name.toLowerCase().endsWith('.m4a') || file.name.toLowerCase().endsWith('.wav')) {
              // Adyny we aýdymçysyny awtomatiki aýyrmak: "Aýdymçy - Aýdym.mp3"
              let cleanName = file.name.replace(/\.[^/.]+$/, "");
              let parts = cleanName.split(' - ');
              let artist = parts.length > 1 ? parts[0].trim() : "Türkmen Aýdymçy";
              let title = parts.length > 1 ? parts[1].trim() : cleanName.trim();

              // jsDelivr arkaly bütin dünýä üçin çäksiz tizlikli audio link
              const cdnUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_REPO}@main/music/${encodeURIComponent(file.name)}`;

              loadedSongs.push({
                id: 'gh_' + index,
                title: title,
                artist: artist,
                url: cdnUrl,
                fileName: file.name
              });
            }
          });
        }
      } catch (err) {
        console.warn('GitHub music papkasy okalyp bilinmedi:', err);
      }

      // 2. Eger GitHub-yň esasy katalogyna (root) hem aýdym atylan bolsa, ony hem barlamak
      try {
        const rootRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents?t=` + Date.now());
        if (rootRes.ok) {
          const rootFiles = await rootRes.json();
          rootFiles.forEach((file, index) => {
            if (file.name.toLowerCase().endsWith('.mp3')) {
              let cleanName = file.name.replace(/\.[^/.]+$/, "");
              let parts = cleanName.split(' - ');
              let artist = parts.length > 1 ? parts[0].trim() : "Aýdymçy";
              let title = parts.length > 1 ? parts[1].trim() : cleanName.trim();
              const cdnUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_REPO}@main/${encodeURIComponent(file.name)}`;

              // Gaýtalanmaýan bolsa goşýarys
              if (!loadedSongs.some(s => s.fileName === file.name)) {
                loadedSongs.push({
                  id: 'root_' + index,
                  title: title,
                  artist: artist,
                  url: cdnUrl,
                  fileName: file.name
                });
              }
            }
          });
        }
      } catch (e) {}

      // 3. Eger GitHub-da aýdym entek az bolsa, standart synag aýdymlaryny hem goşýarys
      if (loadedSongs.length === 0) {
        loadedSongs.push(
          { id: 1, title: "Bad Times", artist: "Imael Angel", url: `https://cdn.jsdelivr.net/gh/${GITHUB_REPO}@main/bad_times.mp3`, fileName: "bad_times.mp3" },
          { id: 2, title: "Gözleriň", artist: "Mekan Ataýew", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", fileName: "gozlerin.mp3" }
        );
      }

      songs = loadedSongs;
      statusBadge.innerText = `✅ ${songs.length} sany aýdym taýyn`;
      renderSongs();
    }

    function renderSongs() {
      const container = document.getElementById('songsList');
      container.innerHTML = '';

      songs.forEach((song, index) => {
        const row = document.createElement('div');
        row.className = `song-row ${currentIndex === index ? 'playing' : ''}`;
        const isCurrentPlaying = (currentIndex === index && !audio.paused);
        const icon = isCurrentPlaying ? '⏸' : '▶';

        row.innerHTML = `
          <div class="song-left" onclick="playSongAtIndex(${index})">
            <button class="play-icon-btn">${icon}</button>
            <div class="song-meta">
              <h4>${song.title}</h4>
              <span>${song.artist}</span>
            </div>
          </div>
          <div class="song-right">
            <button class="btn-download" onclick="downloadSong(event, ${index})">📥 Ýükläp al</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function playSongAtIndex(index) {
      if (index < 0 || index >= songs.length) return;
      if (currentIndex === index) {
        togglePlayPause();
        return;
      }

      currentIndex = index;
      const song = songs[index];
      document.getElementById('npTitle').innerText = song.title;
      document.getElementById('npArtist').innerText = song.artist;

      audio.src = song.url;
      audio.play().catch(e => console.log('Autoplay play blocked:', e));
      document.getElementById('mainPlayBtn').innerText = '⏸';
      renderSongs();
    }

    function togglePlayPause() {
      if (currentIndex === -1) {
        playSongAtIndex(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        document.getElementById('mainPlayBtn').innerText = '⏸';
      } else {
        audio.pause();
        document.getElementById('mainPlayBtn').innerText = '▶';
      }
      renderSongs();
    }

    function playNext() {
      if (songs.length === 0) return;
      playSongAtIndex((currentIndex + 1) % songs.length);
    }

    function playPrev() {
      if (songs.length === 0) return;
      playSongAtIndex((currentIndex - 1 + songs.length) % songs.length);
    }

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progressBarFill').style.width = `${progress}%`;
      document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
      document.getElementById('totalDuration').innerText = formatTime(audio.duration);
    });

    audio.addEventListener('ended', playNext);

    function seekAudio(e) {
      const rect = document.getElementById('progressBarBg').getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (audio.duration) {
        audio.currentTime = (clickX / rect.width) * audio.duration;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function downloadSong(e, index) {
      e.stopPropagation();
      const song = songs[index];
      const a = document.createElement('a');
      a.href = song.url;
      a.download = `${song.artist} - ${song.title}.mp3`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function downloadCurrentSong() {
      if (currentIndex === -1) return alert('Aýdym saýlaň!');
      downloadSong(new Event('click'), currentIndex);
    }

    window.onload = fetchGitHubSongs;
  </script>
</body>
</html>
