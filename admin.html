<!DOCTYPE html>
<html lang="tk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dolandyryş Paneli — Ösüşe barýan ýol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090c13;
      --bg-surface: #101522;
      --bg-surface-elevated: #161c2d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --brand: #10b981;
      --brand-hover: #059669;
      --brand-glow: rgba(16, 185, 129, 0.2);
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-sub: #64748b;
      --brand: #059669;
      --brand-hover: #047857;
      --brand-glow: rgba(5, 150, 105, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.15s, border 0.15s; }
    body { background-color: var(--bg-base); color: var(--text); padding: 24px 20px; min-height: 100vh; }
    .container { max-width: 980px; margin: 0 auto; }

    .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; flex-shrink: 0; }
    .icon-sm { width: 14px; height: 14px; }

    /* PAROL LOCK */
    .lock-screen { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .lock-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 18px; padding: 36px 32px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.3); }
    .lock-badge { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-glow); color: var(--brand); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; }
    .lock-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
    .lock-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
    .lock-input { width: 100%; padding: 12px 14px; background: var(--bg-surface-elevated); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; margin-bottom: 16px; text-align: center; letter-spacing: 2px; }
    .lock-input:focus { border-color: var(--brand); }
    .btn-lock-submit { width: 100%; background: var(--brand); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.15s; }
    .btn-lock-submit:hover { background: var(--brand-hover); }

    /* DASHBOARD */
    .admin-panel { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .logo-badge { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), #0284c7); display: flex; align-items: center; justify-content: center; color: #fff; }
    .header-title { font-size: 20px; font-weight: 800; color: var(--text); }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-site-link { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .btn-site-link:hover { border-color: var(--brand); color: var(--brand); }
    .btn-logout { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* TABLAR */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-item { background: transparent; border: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.15s; }
    .tab-item:hover { color: var(--text); background: var(--bg-surface); }
    .tab-item.active { background: var(--brand); color: #fff; }

    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .card-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; color: var(--text); display: flex; align-items: center; gap: 10px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-col { display: flex; flex-direction: column; gap: 6px; }
    .form-col.full { grid-column: 1 / -1; }
    .form-label { font-size: 12.5px; font-weight: 700; color: var(--text-sub); }
    .form-input, .form-textarea { padding: 12px 14px; background: var(--bg-surface-elevated); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13.5px; outline: none; }
    .form-input:focus, .form-textarea:focus { border-color: var(--brand); }
    .form-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }

    .btn-submit { background: var(--brand); color: #fff; border: none; padding: 13px 20px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; transition: all 0.15s; }
    .btn-submit:hover { background: var(--brand-hover); }

    .article-item-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface-elevated); border: 1px solid var(--border); padding: 14px 18px; border-radius: 12px; margin-bottom: 10px; }
    .row-left { display: flex; align-items: center; gap: 14px; }
    .row-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
    .row-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .row-meta { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
    .btn-del { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-del:hover { background: #ef4444; color: #fff; }

    .toast-box { position: fixed; bottom: 24px; right: 24px; background: var(--brand); color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; box-shadow: 0 8px 24px var(--brand-glow); display: none; z-index: 400; }

    @media (max-width: 650px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- GORAG (PAROL GİRİZILMELI) -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-badge">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2 class="lock-title">Admin Dolandyryş Paneli</h2>
      <p class="lock-desc">Diňe saýtyň admini üçin goralan bölüm. Dowam etmek üçin şahsy parolyňyzy giriziň:</p>
      <input type="password" class="lock-input" id="adminPasswordInput" placeholder="Paroly giriziň" autofocus>
      <button class="btn-lock-submit" onclick="verifyAdminPassword()">Giriş Etmek</button>
    </div>
  </div>

  <!-- DOLANDYRYŞ PANELI -->
  <div class="container admin-panel" id="adminDashboard">
    <header class="header">
      <div class="header-brand">
        <div class="logo-badge">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </div>
        <div class="header-title">Ösüşe barýan ýol — Redaksiýa Paneli</div>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn-site-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Saýta Gaýt
        </a>
        <button class="btn-logout" onclick="logoutAdmin()">Çykmak</button>
      </div>
    </header>

    <div class="tab-bar">
      <button class="tab-item active" onclick="switchAdminTab('tabAddArticle')">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Täze Makala Goşmak
      </button>
      <button class="tab-item" onclick="switchAdminTab('tabAds')">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Mahabat & Bildirişler
      </button>
      <button class="tab-item" onclick="switchAdminTab('tabManage')">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        Bar Bolan Makalalar
      </button>
    </div>

    <!-- 1. TÄZE MAKALA -->
    <div id="tabAddArticle" class="tab-pane">
      <div class="card">
        <div class="card-title">Täze Makala ýa-da Habar Döretmek</div>
        <form id="newArticleForm">
          <div class="form-grid">
            <div class="form-col full">
              <label class="form-label">Makalanyň Sözbaşysy *</label>
              <input type="text" class="form-input" id="inpArtTitle" placeholder="Mysal: Sanly ulgamyň ösüşi we täze sepgitler" required>
            </div>
            <div class="form-col">
              <label class="form-label">Kategoriýasy *</label>
              <select class="form-input" id="inpArtCat" required>
                <option value="Ösüş & Tehnologiýa">Ösüş & Tehnologiýa</option>
                <option value="Biznes & Ykdysadyýet">Biznes & Ykdysadyýet</option>
                <option value="Bildirişler & Mahabat">Bildirişler & Mahabat</option>
                <option value="Ylym & Bilim">Ylym & Bilim</option>
              </select>
            </div>
            <div class="form-col">
              <label class="form-label">Awtoryň Ady *</label>
              <input type="text" class="form-input" id="inpArtAuthor" placeholder="Mysal: Merdan Myradow" required>
            </div>
            <div class="form-col full">
              <label class="form-label">Surat URL (Esasy Foto) *</label>
              <input type="url" class="form-input" id="inpArtImg" value="https://images.unsplash.com/photo-1518770660439-4636190af475?w=900&auto=format&fit=crop" required>
            </div>
            <div class="form-col full">
              <label class="form-label">Gysgaça Mazmuny (Snippet) *</label>
              <input type="text" class="form-input" id="inpArtSnippet" placeholder="Makalanyň esasy mazmunyny beýan edýän 1-2 sözlem..." required>
            </div>
            <div class="form-col full">
              <label class="form-label">Makalanyň Doly Teksti *</label>
              <textarea class="form-textarea" id="inpArtContent" placeholder="Makalanyň doly tekstini bu ýere ýazyň..." required></textarea>
            </div>
          </div>
          <button type="submit" class="btn-submit">Makalany Çap Etmek (Saýtda Peýda Bolar)</button>
        </form>
      </div>
    </div>

    <!-- 2. MAHABAT -->
    <div id="tabAds" class="tab-pane" style="display: none;">
      <div class="card">
        <div class="card-title">Baş Sahypadaky Mahabat / Bildiriş Banneri</div>
        <form id="adsForm">
          <div class="form-grid">
            <div class="form-col full">
              <label class="form-label">Mahabat / Bildiriş Başlygy *</label>
              <input type="text" class="form-input" id="inpAdTitle" placeholder="Mysal: Kärhanaňyz üçin sanly mahabat hyzmatlary" required>
            </div>
            <div class="form-col full">
              <label class="form-label">Gysgaça Düşündiriş *</label>
              <input type="text" class="form-input" id="inpAdSub" placeholder="Mysal: Web-sahypa, SEO we elektron söwda platformalary elýeterli bahadan." required>
            </div>
          </div>
          <button type="submit" class="btn-submit">Mahabat Bannerini Täzelemek</button>
        </form>
      </div>
    </div>

    <!-- 3. DOLANDYRYS -->
    <div id="tabManage" class="tab-pane" style="display: none;">
      <div class="card">
        <div class="card-title">Bar Bolan Ähli Makalalar (<span id="totalArtCount">0</span>)</div>
        <div id="manageArticlesContainer"></div>
      </div>
    </div>

  </div>

  <div class="toast-box" id="toastMsg">Habar</div>

  <script>
    const ADMIN_PASS = "admin2026";
    let portalData = null;

    function verifyAdminPassword() {
      const val = document.getElementById('adminPasswordInput').value.trim();
      if (val === ADMIN_PASS) {
        sessionStorage.setItem('osuse_admin_auth', 'true');
        showDashboard();
      } else {
        alert('Parol nädogry! Täzeden synanyşyň.');
      }
    }

    function checkAuth() {
      if (sessionStorage.getItem('osuse_admin_auth') === 'true') {
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      loadAdminData();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('osuse_admin_auth');
      window.location.reload();
    }

    function switchAdminTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      event.currentTarget.classList.add('active');
    }

    function showToast(text) {
      const t = document.getElementById('toastMsg');
      t.innerText = text;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function loadAdminData() {
      const raw = localStorage.getItem('osuse_baran_yol_data');
      if (raw) {
        portalData = JSON.parse(raw);
      } else {
        portalData = { articles: [], adBanner: {} };
      }
      renderManageList();

      if (portalData.adBanner) {
        document.getElementById('inpAdTitle').value = portalData.adBanner.title || '';
        document.getElementById('inpAdSub').value = portalData.adBanner.sub || '';
      }
    }

    function renderManageList() {
      const container = document.getElementById('manageArticlesContainer');
      container.innerHTML = '';
      const list = portalData.articles || [];
      document.getElementById('totalArtCount').innerText = list.length;

      if (list.length === 0) {
        container.innerHTML = '<div style="color: var(--text-sub); padding: 20px;">Häzirlikçe makala ýok.</div>';
        return;
      }

      list.forEach((a, idx) => {
        const row = document.createElement('div');
        row.className = 'article-item-row';
        row.innerHTML = `
          <div class="row-left">
            <img src="${a.cover}" class="row-thumb" alt="thumb">
            <div>
              <div class="row-title">${a.title}</div>
              <div class="row-meta">${a.category} • ${a.date} • Awtory: ${a.author}</div>
            </div>
          </div>
          <button class="btn-del" onclick="deleteArticle(${idx})">Pozmak ✕</button>
        `;
        container.appendChild(row);
      });
    }

    document.getElementById('newArticleForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('inpArtTitle').value.trim();
      const category = document.getElementById('inpArtCat').value;
      const author = document.getElementById('inpArtAuthor').value.trim();
      const cover = document.getElementById('inpArtImg').value.trim();
      const snippet = document.getElementById('inpArtSnippet').value.trim();
      const content = document.getElementById('inpArtContent').value.trim();

      const newArt = {
        id: 'art_' + Date.now(),
        title,
        category,
        author,
        date: new Date().toLocaleDateString('tk-TM', { day: 'numeric', month: 'long', year: 'numeric' }),
        readTime: "3 min okalýar",
        cover,
        snippet,
        content,
        likes: 0,
        comments: []
      };

      if (!portalData.articles) portalData.articles = [];
      portalData.articles.unshift(newArt);
      localStorage.setItem('osuse_baran_yol_data', JSON.stringify(portalData));

      showToast(`«${title}» makalasy üstünlikli çap edildi!`);
      document.getElementById('newArticleForm').reset();
      renderManageList();
    });

    document.getElementById('adsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('inpAdTitle').value.trim();
      const sub = document.getElementById('inpAdSub').value.trim();

      portalData.adBanner = { title, sub, link: "#articlesGrid" };
      localStorage.setItem('osuse_baran_yol_data', JSON.stringify(portalData));
      showToast('Mahabat banneri täzelendi!');
    });

    function deleteArticle(idx) {
      if (confirm('Hakykatdan hem bu makalany saýtdan aýyrmak isleýärsiňizmi?')) {
        portalData.articles.splice(idx, 1);
        localStorage.setItem('osuse_baran_yol_data', JSON.stringify(portalData));
        renderManageList();
        showToast('Makala pozuldy.');
      }
    }

    window.onload = checkAuth;
  </script>
</body>
</html>
